server:
  port: 8080                 # Port on which the Spring Boot application will run
  servlet:
    context-path: /FacilonApiServer # Context path for the application endpoints
  ssl:
    enabled: true
    key-store: classpath:wildcard_logiai_com.pfx
    key-store-password: 123456789
    key-store-type: JKS
    key-store-provider: SUN



client:
  port: 4200
  host: localhost


app:
  cors_origins_url: https://${client.host}:${client.port}
  client_url: https://${client.host}:${client.port}
  security:
    jwtTokenExpirationInMills: 604800000
    jwtSecret: k2SId+qxOCWNmeptM4Y0hK7ncitTcB+zMXa50pe5Ldc=
    maxLoginFailureCount: 3
    passwordExpiryInDays: 30
    passwordExpiryInDays1: 40
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/facilon?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true  # JDBC URL for MySQL database
    username: root                            # Username for the MySQL database
    password: root                            # Password for the MySQL database
    driver-class-name: com.mysql.cj.jdbc.Driver           # JDBC driver class for MySQL
  security:
    enable: true
    require-ssl: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  jpa:
    hibernate:
      ddl-auto: update  # Hibernate schema generation strategy (e.g., update, create-drop)
  liquibase:
    enabled: false
    change-log: classpath:/db/db.changelog-master.xml
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}

management:
  endpoint:
    health:
      enabled: true       # Enable Actuator health endpoint
  endpoints:
    web:
      exposure:
        include: health  # Expose Actuator health endpoint

springdoc:
  api-docs:
    path: /facilon-api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.myapp: DEBUG
  file:
    name: app.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %level - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

graph:
  email:
    enabled: true
    tenant-id: ${GRAPH_EMAIL_TENANT_ID:}
    client-id: ${GRAPH_EMAIL_CLIENT_ID:}
    client-secret: ${GRAPH_EMAIL_CLIENT_SECRET:}
    sender-email: ${GRAPH_EMAIL_SENDER:no-reply@facilonservices.com}
    sender-name: Facilon Platform

integration:
  user-mgmt:
    enabled: true
    url: ${USER_MGMT_SERVICE_URL}
  email:
    enabled: false
    url: ${EMAIL_SERVICE_URL:}
  sms:
    enabled: false
    url: ${SMS_API_URL:}
    auth-header: ${SMS_AUTH_HEADER:}
    sender-id: ${SMS_SENDER_ID:FACILN}

dataverse:
  powerapp-sync:
    cron: "0 * * * * *"
    cron-enabled: true
    top: 1
    registration-base-url: ${POWERAPP_REGISTRATION_BASE_URL}
    email-subject: "Complete Your User Registration with Facilon Services"
  master-sync:
    run-on-startup: false
    cron: "0 0 2 * * *"
    cron-enabled: true
  document-status-sync:
    cron: "0 */15 * * * *"
    cron-enabled: true
  sharepoint:
    parent-location-id: ${DATAVERSE_SHAREPOINT_PARENT_LOCATION_ID:112fd6a2-12f1-f011-8406-7ced8d285638}
    site-collection-id: ${DATAVERSE_SHAREPOINT_SITE_COLLECTION_ID:43de59de-265e-f011-877b-7c1e5232a375}

b2b:
  invite:
    redirect-url: ${B2B_INVITE_REDIRECT_URL:https://fportalonboard.powerappsportals.com}

investor:
  onboarding:
    default-tenant-id: ${INVESTOR_DEFAULT_TENANT_ID:1}
    india-country-code: 240
    india-isd-code: 91
    batch-default-password: ${INVESTOR_BATCH_DEFAULT_PASSWORD}
  introduced:
    laravel-app-key: ${LARAVEL_APP_KEY}
    laravel-cipher: aes-256-cbc
  kyc:
    upload-dir: ${KYC_UPLOAD_DIR:uploads/kyc}

sharepoint:
  investor-documents:
    base-url: ${SHAREPOINT_INVESTOR_DOCS_BASE_URL:https://facilon.sharepoint.com/sites/CRM/ss_investordocuments}

ignored:
  httpUrl:
    - /api/login
    - /swagger-ui/**
    - /facilon-api-docs/**
    - /swagger-ui.html
    - /api/users/register
    - /api/users/forgot-password
    - /api/users/reset-password
    - /actuator/health
    - /api/users/checkEmail
    - /api/admin/register
    - /api/clients/onboarding/**
    - /api/clients/sp/**
    - /api/investor/introduced/**
    - /api/admin/tenants/*/admin-user
    - /api/admin/users/*/roles/*
    - /api/super-admin/migrate-tenants
    - /api/azure-ad/create-user-latest
    - /api/azure-ad/log-password-failure-count
    - /api/clients/content/**
    - /api/clients/introduced-investor/nextholder/docs/**
    - /api/clients/pms-investor/nextholder/docs/**
    - /api/auth/azure-b2c/**
    - /api/graph-email/**
    - /api/clients/documents/submission/**