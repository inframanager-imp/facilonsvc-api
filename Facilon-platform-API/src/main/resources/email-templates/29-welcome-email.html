<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <h2 style="color: #2c3e50;">Welcome to Facilon, {{fullName}}!</h2>
        <p>Your registration has been completed successfully.</p>
        <div style="background-color: #d4edda; padding: 15px; border-left: 4px solid #28a745; margin: 20px 0;">
            <p style="margin: 0;"><strong>Account Activated</strong></p>
        </div>
        <p>You can now log in to your account using your registered email and password.</p>
        <p style="font-size: 12px; color: #666; margin-top: 24px;">
            Thank you for choosing Facilon Platform. If you have any questions, please contact our support team.
        </p>
    </div>
