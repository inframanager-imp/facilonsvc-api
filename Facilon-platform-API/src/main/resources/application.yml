spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB   # allows multi-file DSR supporting evidence (up to 10 x 5MB)

# SECURITY: every profile sets org.springframework.web=DEBUG, which makes RestTemplate
# log full outbound request bodies. The OAuth2 client-credentials token call (SharePoint
# + Dynamics) then leaks the Azure client_secret in plaintext. Pin this more-specific
# logger to INFO so token request bodies are never logged; it overrides the broader
# org.springframework.web=DEBUG in all profiles (Logback resolves by most-specific name).
logging:
  level:
    org.springframework.web.client.RestTemplate: INFO

# JAVAPDFill service — fills the blank Ventura NRI AcroForm PDF with investor data.
# Deployed separately (see d:/sam/facilon-git_bub/JAVAPDFill); Facilon calls it over HTTP.
fillpdf:
  api:
    # Base URL of the JAVAPDFill Spring Boot service. Endpoints: POST {base-url}/api/v2/fill
    base-url: ${FILLPDF_BASE_URL:http://localhost:8086/fillSampdf}
    # Socket connect timeout — low, the service is typically on the same network
    connect-timeout-ms: 5000
    # Response read timeout — PDFBox fill of a 36-page booklet can take several seconds
    read-timeout-ms: 60000
    # Retry on network failures (ResourceAccessException). 0 = no retry, 1 = one extra attempt.
    retry-attempts: 1
    # strict=true makes JAVAPDFill throw on any validation error (missing required fields etc.).
    # Keep false during rollout so partial data still produces a PDF.
    strict: false
    # verify=true re-reads the filled PDF to confirm every value round-trips. Slower; useful in QA.
    verify: false
  kyc:
    # Engine switch: "fillapi" uses JAVAPDFill + blank PDF; "playwright" renders FTL -> HTML -> PDF (legacy).
    # Per-request override available via ?engine= query param on the /kyc-form endpoint.
    engine: ${KYC_PDF_ENGINE:fillapi}
    # Classpath path to the blank fillable NRI booklet (loaded by KycPdfService.generateKycPdfViaFillApi).
    nri-template: templates/pdf/kyc-form/nri/Ventura_Account_opening_NRI.pdf

# Encrypted Azure Blob storage for confirmed KYC documents
# (plan: implemented_docs/kyc-blob-journey-consent-plan.md, Phase 1/2).
# Default OFF so the app boots without Azure until a real connection string is set.
# connection-string is a SECRET — keep it in env, never commit/log it.
azure:
  blob:
    enabled: ${AZURE_BLOB_ENABLED:false}
    # SECRET — provide via the AZURE_BLOB_CONNECTION_STRING env var only. Never commit it.
    connection-string: ${AZURE_BLOB_CONNECTION_STRING:}
    container-name: ${AZURE_BLOB_CONTAINER:facilondocs}

# App-level AES-256-GCM key for KYC document encryption (base64 of 32 raw bytes).
# Keep STABLE — rotating without a versioned key registry makes old blobs undecryptable.
document:
  encryption:
    # SECRET — provide via the DOCUMENT_ENCRYPTION_KEY env var only (base64 of 32 bytes). Never commit it.
    key: ${DOCUMENT_ENCRYPTION_KEY:}

# Smart Upload OCR - integrates with the ORCReader microservice (plan §3.5).
# ORCReader must be running as a separate process; default http://localhost:8080.
ai:
  ocr:
    base-url: ${OCR_BASE_URL:http://localhost:8080}
    endpoint: /api/kyc/extract
    provider: ${OCR_PROVIDER:mistral}
    timeout-seconds: 60
    apply-ocr: true

# KYC expiry monitoring (plan §3.7).
kyc:
  expiry:
    cron: "0 0 2 * * *"
    cron-enabled: true
    warn-window-days: 30
    notify-interval-days: 7
  # Derived validity for address proofs that have no native expiry field.
  # A utility bill or bank statement is valid as address proof for 90 days from issue;
  # a rent agreement without an OCR-detected end date defaults to ~11 months.
  address-proof:
    recent-doc-validity-days: 90
    rent-agreement-validity-days: 335
  # Strict document-type enforcement for Smart Upload (plan: implemented_docs/
  # smart-upload-document-validation.md). All default OFF so the code ships dormant.
  # Enable per environment ONLY after ORCReader OCI/Passport disambiguation is verified.
  validation:
    # Reject (HTTP 409) when OCR-detected type is unknown or mismatches the slot.
    block-type-mismatch: ${KYC_BLOCK_TYPE_MISMATCH:true}
    # Require the slot's defining ID number (PAN/Aadhaar/Passport/OCI) to be present & valid.
    require-id-field: ${KYC_REQUIRE_ID_FIELD:true}
    # Reject when ORCReader is down/unsuccessful. WARNING: halts all KYC uploads during an OCR outage.
    block-on-ocr-failure: ${KYC_BLOCK_ON_OCR_FAILURE:true}
  # Documents Center storage: when azure.blob.enabled AND DOCUMENT_ENCRYPTION_KEY
  # are set, the file is encrypted into staged_content at upload and pushed to
  # Azure Blob on "Looks right". Default ON (kill-switch back to immediate storage).
  storage:
    defer-to-confirm: ${KYC_DEFER_STORAGE_TO_CONFIRM:true}